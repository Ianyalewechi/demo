name: 10Alytics CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"

  workflow_dispatch:

# ============================================================
# GITHUB ACTIONS PERMISSIONS
# ============================================================

permissions:
  id-token: write
  contents: read


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

  ACR_NAME: ${{ vars.ACR_NAME }}
  VM_NAME: ${{ vars.VM_NAME }}

  IMAGE_NAME: 10alytics-app
  IMAGE_TAG: ${{ github.sha }}


# ============================================================
# JOB 1
# TEST APPLICATION
# ============================================================

jobs:

  test:
    name: Test Flask Application

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # Verify Python
      # --------------------------------------------------------

      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # --------------------------------------------------------
      # Run tests
      # --------------------------------------------------------

      - name: Run pytest
        working-directory: app
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v


# ============================================================
# JOB 2
# TERRAFORM PLAN
# ============================================================

  terraform-plan:
    name: Terraform Plan

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure OIDC Authentication
      # --------------------------------------------------------

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init


      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check


      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate


      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -out=tfplan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="resource_group_name=${{ env.AZURE_RESOURCE_GROUP }}" \
            -var="location=${{ env.AZURE_LOCATION }}" \
            -var="acr_name=${{ env.ACR_NAME }}" \
            -var="vm_name=${{ env.VM_NAME }}" \
            -var="key_vault_name=${{ vars.KEY_VAULT_NAME }}" \
            -var="github_repository=${{ github.repository }}" \
            -var="github_branch=${{ github.ref_name }}" \
            -var="ssh_public_key=${{ secrets.VM_SSH_PUBLIC_KEY }}"


      # --------------------------------------------------------
      # Convert plan to readable output
      # --------------------------------------------------------

      - name: Show Terraform Plan
        working-directory: terraform
        run: |
          terraform show tfplan


      # --------------------------------------------------------
      # Upload exact Terraform plan
      # --------------------------------------------------------

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 1


# ============================================================
# JOB 3
# TERRAFORM APPLY
#
# IMPORTANT:
# This job uses the terraform-apply GitHub Environment.
# Configure that environment with Required Reviewers.
# ============================================================

  terraform-apply:
    name: Terraform Apply

    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    environment:
      name: terraform-apply

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure OIDC Authentication
      # --------------------------------------------------------

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init


      # --------------------------------------------------------
      # Download exact plan generated earlier
      # --------------------------------------------------------

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform


      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            tfplan


# ============================================================
# JOB 4
# BUILD AND PUSH DOCKER IMAGE
# ============================================================

  build:
    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    needs:
      - terraform-apply

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure OIDC Authentication
      # --------------------------------------------------------

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Login to ACR
      # --------------------------------------------------------

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${ACR_NAME}"


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest" \
            .


      # --------------------------------------------------------
      # Push immutable SHA image
      # --------------------------------------------------------

      - name: Push versioned Docker image
        run: |
          docker push \
            "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"


      # --------------------------------------------------------
      # Push latest image
      # --------------------------------------------------------

      - name: Push latest Docker image
        run: |
          docker push \
            "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest"


# ============================================================
# JOB 5
# DEPLOY TO AZURE VM
#
# Deployment uses Azure VM Run Command.
# No SSH is required.
# ============================================================

  deploy:
    name: Deploy Application to Azure VM

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      # --------------------------------------------------------
      # Azure OIDC Authentication
      # --------------------------------------------------------

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Deploy through Azure VM Run Command
      # --------------------------------------------------------

      - name: Deploy Docker container
        shell: bash
        run: |

          cat > deploy.sh <<EOF

          set -e

          echo "=========================================="
          echo "10Alytics VM Deployment"
          echo "=========================================="

          echo "Logging into Azure using VM Managed Identity..."

          az login \
            --identity \
            --allow-no-subscriptions


          echo "Logging into Azure Container Registry..."

          az acr login \
            --name ${ACR_NAME}


          echo "Pulling Docker image..."

          docker pull \
            ${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}


          echo "Stopping existing application container..."

          docker rm -f 10alytics-app 2>/dev/null || true


          echo "Starting new application container..."

          docker run -d \
            --name 10alytics-app \
            --restart unless-stopped \
            -p 80:5000 \
            ${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}


          echo "Waiting for application to start..."

          sleep 10


          echo "Checking application health..."

          curl --fail \
            --retry 5 \
            --retry-delay 3 \
            http://localhost/health


          echo ""

          echo "Checking application readiness..."

          curl --fail \
            --retry 5 \
            --retry-delay 3 \
            http://localhost/health/ready


          echo ""

          echo "Running containers..."

          docker ps


          echo "=========================================="
          echo "Deployment completed successfully"
          echo "=========================================="

          EOF


          az vm run-command invoke \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${VM_NAME}" \
            --command-id RunShellScript \
            --scripts @deploy.sh


# ============================================================
# JOB 6
# FINAL HEALTH CHECK
# ============================================================

  health-check:
    name: Application Health Check

    runs-on: ubuntu-latest

    needs:
      - deploy

    steps:

      # --------------------------------------------------------
      # Azure OIDC Authentication
      # --------------------------------------------------------

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Run health checks inside VM
      # --------------------------------------------------------

      - name: Verify application health
        shell: bash
        run: |

          cat > health-check.sh <<'EOF'

          set -e

          echo "=========================================="
          echo "Application Health Check"
          echo "=========================================="

          echo "Checking /health..."

          curl --fail \
            --retry 5 \
            --retry-delay 3 \
            http://localhost/health

          echo ""

          echo "Checking /health/ready..."

          curl --fail \
            --retry 5 \
            --retry-delay 3 \
            http://localhost/health/ready

          echo ""

          echo "Docker container status..."

          docker ps \
            --filter "name=10alytics-app"

          echo ""

          echo "Application verification successful."

          EOF


          az vm run-command invoke \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${VM_NAME}" \
            --command-id RunShellScript \
            --scripts @health-check.sh


      # --------------------------------------------------------
      # Final message
      # --------------------------------------------------------

      - name: Deployment successful
        run: |
          echo "=========================================="
          echo "10Alytics CI/CD pipeline completed"
          echo "Application deployed and verified successfully"
          echo "=========================================="