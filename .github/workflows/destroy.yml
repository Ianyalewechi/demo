name: 10Alytics Destroy Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

  ACR_NAME: ${{ vars.ACR_NAME }}
  VM_NAME: ${{ vars.VM_NAME }}
  KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}


# ============================================================
# JOB 1
# TERRAFORM DESTROY PLAN
# ============================================================

jobs:

  destroy-plan:
    name: Terraform Destroy Plan

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure OIDC Authentication
      # --------------------------------------------------------

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init


      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check


      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate


      # --------------------------------------------------------
      # Terraform Destroy Plan
      # --------------------------------------------------------

      - name: Terraform Destroy Plan
        working-directory: terraform
        run: |
          terraform plan \
            -destroy \
            -out=destroy.tfplan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="resource_group_name=${{ env.AZURE_RESOURCE_GROUP }}" \
            -var="location=${{ env.AZURE_LOCATION }}" \
            -var="acr_name=${{ env.ACR_NAME }}" \
            -var="vm_name=${{ env.VM_NAME }}" \
            -var="key_vault_name=${{ env.KEY_VAULT_NAME }}" \
            -var="github_repository=${{ github.repository }}" \
            -var="github_branch=main" \
            -var="ssh_public_key=${{ secrets.VM_SSH_PUBLIC_KEY }}"


      # --------------------------------------------------------
      # Display destroy plan
      # --------------------------------------------------------

      - name: Show Destroy Plan
        working-directory: terraform
        run: |
          terraform show destroy.tfplan


      # --------------------------------------------------------
      # Upload exact destroy plan
      # --------------------------------------------------------

      - name: Upload destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan
          path: terraform/destroy.tfplan
          retention-days: 1


# ============================================================
# JOB 2
# DESTROY AFTER APPROVAL
#
# IMPORTANT:
# Configure the terraform-destroy GitHub Environment
# with Required Reviewers.
# ============================================================

  destroy:
    name: Destroy Azure Infrastructure

    runs-on: ubuntu-latest

    needs:
      - destroy-plan

    environment:
      name: terraform-destroy

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure OIDC Authentication
      # --------------------------------------------------------

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init


      # --------------------------------------------------------
      # Download exact destroy plan
      # --------------------------------------------------------

      - name: Download destroy plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan
          path: terraform


      # --------------------------------------------------------
      # Terraform Destroy
      # --------------------------------------------------------

      - name: Terraform Destroy
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            destroy.tfplan


      # --------------------------------------------------------
      # Completion
      # --------------------------------------------------------

      - name: Destroy completed
        run: |
          echo "=========================================="
          echo "10Alytics Azure infrastructure destroyed"
          echo "=========================================="